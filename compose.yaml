name: suresente
services:
  db:
    image: postgres:16.8-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sure_sente}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sure_sente_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sure_sente}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL, e.g. ecto://sure_sente:PASS@db:5432/sure_sente_dev}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE}
      PORT: 4000
      PHX_SERVER: "true"
      PHX_HOST: ${PHX_HOST:-localhost}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      POOL_SIZE: ${POOL_SIZE:-10}
      SEED_DEMO: ${SEED_DEMO:-false}
    ports:
      - "${BACKEND_PORT:-4000}:4000"

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api/v1}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
